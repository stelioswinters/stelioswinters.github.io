  <script>
    let homeMode = "latest";
    let currentCategory = "home";

    const homePageIndex = {};
    const homeItemOrder = {};

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function renderHomeCategory(key) {
      const container = document.getElementById("home-grid-" + key);
      if (!container) return;

      const items = categoryData[key];
      if (!Array.isArray(items)) return;
      if (homePageIndex[key] == null) homePageIndex[key] = 0;

      const base = getHomeOrderedItems(key);
      const start = homePageIndex[key] * 3;
      const slice = base.slice(start, start + 3);

      if (imageObserver) container.querySelectorAll("img.lazy").forEach(img => imageObserver.unobserve(img));
      const fragment = document.createDocumentFragment();
      slice.forEach(item => {
        const card = document.createElement("a");
        card.href = item.link || "#";
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "thumb slide";
        const videoId = key === "youtube" ? getYouTubeId(item.link) : "";
        if (videoId) card.dataset.videoId = videoId;
        const image = document.createElement("img");
        image.src = "data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==";
        image.dataset.src = item.img || "";
        image.alt = item.desc || `${getDisplayTitle(key)} thumbnail`;
        image.loading = "lazy";
        image.decoding = "async";
        image.className = "lazy";
        const description = document.createElement("span");
        description.className = "desc";
        description.textContent = item.desc || "";
        card.append(image, description);
        fragment.appendChild(card);
      });
      container.replaceChildren(fragment);

      // hide/show left arrow
      const left = document.getElementById("arrow-left-" + key);
      const right = document.getElementById("arrow-right-" + key);
      const maxPage = Math.floor((items.length - 1) / 3);

      if (left) left.style.visibility = homePageIndex[key] === 0 ? "hidden" : "visible";
      if (right) right.style.visibility = homePageIndex[key] >= maxPage ? "hidden" : "visible";

      lazyLoadImages(container);
    }

    function homeNext(key) {
      const maxPage = Math.floor((categoryData[key].length - 1) / 3);
      homePageIndex[key] = Math.min((homePageIndex[key] || 0) + 1, maxPage);
      renderHomeCategory(key);
    }

    function homePrev(key) {
      homePageIndex[key] = Math.max((homePageIndex[key] || 0) - 1, 0);
      renderHomeCategory(key);

    const homeOrder = ["youtube", "videogames", "music", "series", "toppicks", "books", "store", "services"];
    
    function getRandomItems(arr, n) {
      const copy = arr.slice();
      n = Math.max(0, Math.min(n, copy.length));
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    function getHomeOrderedItems(key) {
      const source = Array.isArray(categoryData[key]) ? categoryData[key] : [];
      const cached = homeItemOrder[key];
      if (cached && cached.mode === homeMode && cached.source === source) {
        return cached.items;
      }

      let items = source.slice();
      if (homeMode === "latest") items.reverse();
      if (homeMode === "random") items = getRandomItems(items, items.length);

      homeItemOrder[key] = { mode: homeMode, source, items };
      return items;
    }
    
    function loadLazyImage(img) {
      const src = img.dataset.src;
      if (!src) {
        img.classList.add("loaded");
        return;
      }

      if (img.dataset.lazyStarted === "true") return;
      img.dataset.lazyStarted = "true";
      img.addEventListener("load", () => {
        img.classList.add("loaded");
        img.classList.remove("load-error");
      }, { once: true });
      img.addEventListener("error", () => {
        img.classList.add("loaded", "load-error");
        img.alt = img.alt || "Image unavailable";
        img.setAttribute("aria-label", img.alt);
      }, { once: true });
      img.decoding = "async";
      img.loading = "lazy";
      img.fetchPriority = "low";
      img.src = src;
      img.removeAttribute("data-src");
    }

    function lazyLoadImages(root = document) {
      const lazyImages = root.querySelectorAll("img.lazy:not(.loaded)");
      if (!lazyImages.length) return;

      // Graceful fallback for browsers without IntersectionObserver.
      if (!("IntersectionObserver" in window)) {
        lazyImages.forEach(loadLazyImage);
        return;
      }

      // Reuse a single observer instead of creating one every time content changes.
      if (!imageObserver) {
        imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadLazyImage(entry.target);
            observer.unobserve(entry.target);
          });
        }, { rootMargin: "320px 0px", threshold: 0.01 });
      }

      lazyImages.forEach(img => imageObserver.observe(img));
    }
    
    let backToTopFrame = 0;
    function updateBackToTop() {

      if (cat !== "home" && cat !== "contact" && cat !== "about" && cat !== "art" && cat !== "search" && !Array.isArray(categoryData[cat])) return false;
      if (imageObserver) document.querySelectorAll("#main-content img.lazy").forEach(img => imageObserver.unobserve(img));
      currentCategory = cat;
      let html = "";
      const homeCategoriesToRender = [];
      if (cat === "home") {
        html += `<h4 class="category-title">
                   <span class="home-title-tabs">
                     <button type="button" class="tab ${homeMode === "latest" ? "active" : ""}" data-home-mode="latest" id="tab-latest">Latest</button>
                     <button type="button" class="tab ${homeMode === "oldest" ? "active" : ""}" data-home-mode="oldest" id="tab-oldest">Oldest</button>
                     <button type="button" class="tab ${homeMode === "random" ? "active" : ""}" data-home-mode="random" id="tab-random">Random</button>
                   </span>
                 </h4>`;
        homeOrder.forEach(key => {
          if (categoryData[key] && Array.isArray(categoryData[key])) {
            const items = getHomeOrderedItems(key);
            if (items.length) {
              const displayTitle = escapeHTML(getDisplayTitle(key));
              html += `<div class="category-section">
                         <h5 class="category-name"><button type="button" class="carousel-arrow" aria-label="Previous ${displayTitle}" id="arrow-left-${key}" data-home-prev="${key}">◀</button>
                           <span>${displayTitle}</span><button type="button" class="carousel-arrow" aria-label="Next ${displayTitle}" id="arrow-right-${key}" data-home-next="${key}">▶</button>
                           <button type="button" class="view-all-button" data-navigation="${key}">View all →</button>
                         </h5>
                         <div class="grid home-grid" id="home-grid-${key}"></div>
                       </div>`;
              homeCategoriesToRender.push(key);
            }
          }
        });
      } else if (cat === "contact") {
        html = `<h4 class="category-title">Contact</h4>
          <div class="contact-form">
            <form action="mailto:info@stelioswinters.com" method="POST" enctype="text/plain">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
              <label for="subject">Subject:</label>
              <input type="text" id="subject" name="subject" required>
              <label for="message">Message:</label>
              <textarea id="message" name="message" rows="4" required></textarea>
              <button type="submit">Send</button>
            </form>
          </div>`;
      } else if (cat === "about") {
        html = `<h4 class="category-title">About</h4>
        <section class="about-stelios-winters">

  <h3>Who is Stelios Winters?</h3>
  <p>
    I’m an online content creator and artist who makes things I would personally love to watch, play, listen to, or read, using creativity as a way to express emotions and hopefully make the world and people’s lives a little better.
  </p>

  <h3>What do you do online?</h3>
  <p>
    I create online products and content that I am genuinely passionate about, including videos, indie games, music, and books.
  </p>

  <h3>What is STELELE?</h3>
  <p>
    STELELE is my YouTube channel where I focus on making "funny", interesting, and sometimes weird experimental content that reflects my curiosity and personality.
  </p>

  <h3>What kind of videos do you make?</h3>
  <p>
    I make a mix of idea-based videos, trying things for the first time like foods or experiences, technology content, nostalgia and retro topics, and creativity in a relaxed way.
  </p>

  <h3>How do all your projects connect?</h3>
  <p>
    Everything I make is connected, so an idea might start as a YouTube video and later turn into a game, a song, or a book.
  </p>

  <h3>Is there a main theme behind your work?</h3>
  <p>
    The main theme is thinking like a mad scientist and exploring ideas in an out-of-the-box way, even when they don’t fit neatly into categories. Just having fun and enjoying doing it.
  </p>

  <h3>Why do you work in so many creative fields?</h3>
  <p>
    I love consuming content in these fields, and when I feel something is missing or can be done in a better way, I get excited and want to create the thing I wish already existed.
  </p>

  <h3>What role do games play in your creative work?</h3>
  <p>
    Games are everywhere, from video games to sports to everyday systems, and I love them because almost everyone connects with games in some way.
  </p>

  <h3>What kind of games do you make?</h3>
  <p>
    I make indie games that focus on simple, enjoyable mechanics and fun experiences rather than focusing too much on visuals.
  </p>

  <h3>How does music fit into your online presence?</h3>
  <p>
    I grew up listening to music a lot, especially when I was feeling sad, and it helped me through depression and anxiety, so making music is my way of helping others feel better the way music helped me.
  </p>

  <h3>Why did you start writing books?</h3>
  <p>
    Over the years I gathered a lot of knowledge across creativity, content creation, and personal growth, and writing books felt like the best way to share it.
  </p>

  <h3>Who is your content for?</h3>
  <p>
    I create content that I personally enjoy consuming, and I hope it attracts like-minded people so we can build a community that creates a positive impact in the world.
  </p>

  <h3>What do you want people to feel after watching your videos or playing your games?</h3>
  <p>
    If someone is struggling, I hope my content distracts them and helps them feel better, and if they’re not, I just want them to have a good time and enjoy it.
  </p>

  <h3>What makes your approach different from other creators?</h3>
  <p>
    Nothing and everything is unique. I just focus on being honest and authentic in my own insane way, making things I would love to consume myself, and only following trends when they genuinely inspire me, not to chase fame.
  </p>

  <h3>How do you think about growth and success online?</h3>
  <p>
    Emotionally, I already feel successful and proud of my projects, but I haven’t reached the kind of success the world defines as financial yet, which I want so I can be free from society’s constraints and focus on higher-quality work that truly represents what I’m capable of, because right now I know something is still missing.
  </p>

  <h3>What do you want the name Stelios Winters to represent?</h3>
  <p>
    Creativity, no regrets, and never giving up on your goals when you truly believe they can positively impact your future. Listening to other people’s opinions to clear your mind, and inspiring others to keep going.
  </p>

  <h3>What is your long-term vision as an online creator?</h3>
  <p>
    I want to keep creating things I’m passionate about forever, and even if I succeed financially, I don’t care about legacy, I just want to be happy and help make the world a better place.
  </p>

  <h3>Where should someone new start?</h3>
  <p>
    This website is the best place to find everything I do in one spot, but especially the STELELE YouTube channel, where I’m making more personal on-camera content so people can get to know me better.
  </p>

</section>`;
      } else if (cat === "art") {
        html += `<h4 class="category-title">Art</h4><div class="grid">`;
        categoryData[cat].slice().reverse().forEach(item => {
          const artTitle = item.title || "Artwork";
          html += `<div class="photo" role="button" tabindex="0" data-art-src="${escapeHTML(item.img)}" data-art-title="${escapeHTML(artTitle)}" aria-label="View ${escapeHTML(artTitle)} full size">
                     <img src="data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==" data-src="${escapeHTML(item.img)}" alt="${escapeHTML(artTitle)}" class="lazy" loading="lazy" decoding="async">
                     <span class="desc">${escapeHTML(artTitle)}</span>
                   </div>`;
        });
        html += `</div>`;
      } else if (cat === "search") {
        html += `<h4 class="category-title">Search Results</h4>`;
        if (el.results && el.results.length) {
          html += `<div class="grid">`;
          el.results.forEach(item => {
            html += `<a href="${escapeHTML(item.link)}" target="_blank" rel="noopener noreferrer" class="thumb">
                       <img src="data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==" data-src="${escapeHTML(item.img)}" alt="${escapeHTML(item.title)} thumbnail" class="lazy" loading="lazy" decoding="async">
                       <span class="desc">${escapeHTML(item.desc || 'No description available.')}</span>
                     </a>`;
          });
          html += `</div>`;
        } else {
          html += `<p>No results found for "${escapeHTML(el.query)}"</p>`;
        }
      } else {
        let title = getDisplayTitle(cat);
        html += `<h4 class="category-title">${title}</h4><div class="grid">`;
        categoryData[cat].slice().reverse().forEach(item => {
          const videoId = cat === "youtube" ? getYouTubeId(item.link) : "";
          html += `<a href="${escapeHTML(item.link)}" target="_blank" rel="noopener noreferrer" class="thumb"${videoId ? ` data-video-id="${videoId}"` : ""}>
                     <img src="data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==" data-src="${escapeHTML(item.img)}" alt="${escapeHTML(title)} thumbnail" class="lazy" loading="lazy" decoding="async">
                     <span class="desc">${escapeHTML(item.desc || 'No description available')}</span>
                   </a>`;
        });
        html += `</div>`;
      }
      const mainContent = document.getElementById("main-content");
      mainContent.innerHTML = html;
      homeCategoriesToRender.forEach(renderHomeCategory);
      document.querySelectorAll(".sidebar a").forEach(link => { link.classList.remove("active"); link.removeAttribute("aria-current"); });
      const activateLink = link => { link.classList.add("active"); link.setAttribute("aria-current", "page"); };
      if (el && el.tagName && el.closest(".sidebar")) {
        activateLink(el);
      } else {
        document.querySelectorAll(".sidebar a").forEach(link => {
          if (link.textContent.trim().toLowerCase() === getDisplayTitle(cat).toLowerCase()) activateLink(link);
        });
      }
      // Home carousels observe their own three visible images; avoid observing them again here.
      if (cat !== "home") lazyLoadImages(mainContent);
      updateBackToTop();
      if (cat === "youtube") {
        populateYouTubeVideos();
      }
      if (window.innerWidth <= 1050 && document.body.classList.contains("menu-open")) closeMenu();
      window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      return false;
    }
    
    function toggleMenu() {
      const isOpen = document.getElementById("sidebar").classList.contains("open");
      setMenuOpen(!isOpen);
      if (!isOpen && window.innerWidth <= 1050) {
        setTimeout(() => document.getElementById("searchInput")?.focus({ preventScroll: true }), 180);
      }
    }
    
    function syncArtworkModal() {
      const modal = document.getElementById("photoModal");
      const modalImg = modal.querySelector("img");
      const item = artworkGallery[artworkIndex];
      if (!item) return;
      modalImg.alt = `${item.title || "Artwork"} (full size)`;
      modalImg.loading = "eager";
      modalImg.decoding = "async";
      modalImg.src = item.img;
      const counter = document.getElementById("modalCounter");
      if (counter) counter.textContent = `${artworkIndex + 1} / ${artworkGallery.length}`;
      const multiple = artworkGallery.length > 1;
      modal.querySelectorAll(".modal-nav").forEach(button => { button.hidden = !multiple; });
    }

    function openModal(src, title = "Artwork") {
      const modal = document.getElementById("photoModal");
      lastFocusedElement = document.activeElement;
      artworkGallery = Array.isArray(categoryData.art) ? categoryData.art.slice().reverse() : [];
      artworkIndex = artworkGallery.findIndex(item => item.img === src);
      if (artworkIndex < 0) {
        artworkGallery = [{ img: src, title }];
        artworkIndex = 0;
      }
      syncArtworkModal();
      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      const closeButton = modal.querySelector(".close");
      if (closeButton) {
        try { closeButton.focus({ preventScroll: true }); }
        catch (_) { closeButton.focus(); }
      }
    }

    function changeArtwork(direction) {
      if (artworkGallery.length < 2) return;
      artworkIndex = (artworkIndex + direction + artworkGallery.length) % artworkGallery.length;
      syncArtworkModal();
    }

    function closeModal() {
      const modal = document.getElementById("photoModal");
      if (modal.style.display === "none") return;
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (lastFocusedElement && lastFocusedElement !== document.body && lastFocusedElement.isConnected) {
        try { lastFocusedElement.focus({ preventScroll: true }); }
        catch (_) { lastFocusedElement.focus(); }
      }
      artworkIndex = -1;
    }

    document.getElementById("photoModal").addEventListener("click", event => {
      if (event.target === event.currentTarget) closeModal();
    });

    document.addEventListener("keydown", event => {
      const modal = document.getElementById("photoModal");
      const isOpen = modal && modal.style.display !== "none";
      if (!isOpen) return;
      const active = event.target;
      const editing = active && (active.matches("input, textarea, select") || active.isContentEditable);
      if (event.key === "ArrowLeft" && !editing) { event.preventDefault(); changeArtwork(-1); }
      else if (event.key === "ArrowRight" && !editing) { event.preventDefault(); changeArtwork(1); }
      else if (event.key === "Tab") {
        const focusable = [...modal.querySelectorAll("button:not([hidden])")];
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    let portfolioSearchIndex = null;
    function getPortfolioSearchIndex() {
      if (portfolioSearchIndex) return portfolioSearchIndex;
      portfolioSearchIndex = [];
      for (const key of Object.keys(categoryData)) {
        const items = categoryData[key];
        if (!Array.isArray(items)) continue;
        const categoryTitle = getDisplayTitle(key);
        for (const item of items) {
          const title = item.title || item.desc || categoryTitle;
          portfolioSearchIndex.push({
            item,
            title,
            categoryTitle,
            searchable: `${title} ${item.desc || ""} ${item.link || ""} ${categoryTitle}`.toLocaleLowerCase()
          });
        }
      }
      return portfolioSearchIndex;
    }

    let lastPortfolioRouteKey = "";
    function portfolioRouteKey(category, query = "") {
      return category === "search" ? `search:${query}` : category;
    }
    function writePortfolioRoute(category, query = "", replace = false) {
      const url = new URL(window.location.href);
      if (category === "home") url.hash = "";
      else if (category === "search") url.hash = `search=${encodeURIComponent(query)}`;
      else url.hash = encodeURIComponent(category);
      const state = { steliosWintersRoute: true, category, query };
      if (replace) history.replaceState(state, "", url);
      else history.pushState(state, "", url);
      lastPortfolioRouteKey = portfolioRouteKey(category, query);
    }

    function doSearch(queryOverride = null, updateRoute = true) {
      const rawQuery = String(queryOverride ?? document.getElementById("searchInput").value).trim();
      if (!rawQuery) {
        document.getElementById("searchInput").focus();
        return;
      }
      document.getElementById("searchInput").value = rawQuery;
      if (updateRoute) writePortfolioRoute("search", rawQuery);
      const query = rawQuery.toLocaleLowerCase();
      const results = [];
      const seen = new Set();
      for (const entry of getPortfolioSearchIndex()) {
        if (!entry.searchable.includes(query)) continue;
        const item = entry.item;
        const uniqueKey = `${item.link || ""}|${item.img || ""}`;
        if (seen.has(uniqueKey)) continue;
        seen.add(uniqueKey);
        results.push({ img: item.img, link: item.link, title: entry.title, desc: item.desc || entry.title });
      }
      loadContent("search", { results, query: rawQuery });
    }
    document.getElementById("searchInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") { event.preventDefault(); doSearch(); }
    });
    
    function setHomeMode(mode) {
      if (!["latest", "oldest", "random"].includes(mode)) return;
      homeMode = mode;
      Object.keys(homePageIndex).forEach(key => { homePageIndex[key] = 0; });
      Object.keys(homeItemOrder).forEach(key => delete homeItemOrder[key]);
      loadContent("home", document.getElementById("home-link"));
    }

    document.addEventListener("click", event => {
      const target = event.target;
      const navigation = target.closest?.("[data-navigation]");
      if (navigation) {
        event.preventDefault();
        const category = navigation.dataset.navigation;
        writePortfolioRoute(category);
        loadContent(category, navigation);
        return;
      }
      const mode = target.closest?.("[data-home-mode]");
      if (mode) { setHomeMode(mode.dataset.homeMode); return; }
      const previous = target.closest?.("[data-home-prev]");
      if (previous) { homePrev(previous.dataset.homePrev); return; }
      const next = target.closest?.("[data-home-next]");
      if (next) { homeNext(next.dataset.homeNext); return; }
      const action = target.closest?.("[data-ui-action]")?.dataset.uiAction;
      if (action === "toggle-menu") { toggleMenu(); return; }
      if (action === "close-menu") { closeMenu(); return; }
      if (action === "search") { doSearch(); return; }
      if (action === "scroll-top") { scrollToTop(); return; }
      const modalAction = target.closest?.("[data-modal-action]")?.dataset.modalAction;
      if (modalAction === "close") { closeModal(); return; }
      if (modalAction === "previous") { changeArtwork(-1); return; }
      if (modalAction === "next") { changeArtwork(1); return; }
      const artCard = target.closest?.("[data-art-src]");
      if (artCard) openModal(artCard.dataset.artSrc, artCard.dataset.artTitle || "Artwork");
    });

    document.addEventListener("keydown", event => {
      const artCard = event.target.closest?.("[data-art-src]");
      if (artCard && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openModal(artCard.dataset.artSrc, artCard.dataset.artTitle || "Artwork");
        return;
      }
      const target = event.target;
      const typing = target && (target.matches("input, textarea, select") || target.isContentEditable);
      if (event.key === "Escape") {
        closeModal();
        if (window.innerWidth <= 1050) closeMenu();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        if (!document.getElementById("sidebar").classList.contains("open")) setMenuOpen(true);
        document.getElementById("searchInput").focus();
      } else if (event.key === "/" && !typing && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        if (!document.getElementById("sidebar").classList.contains("open")) setMenuOpen(true);
        document.getElementById("searchInput").focus();
      }
    });

    document.addEventListener("click", event => {
      if (window.innerWidth <= 1050 && document.body.classList.contains("menu-open")) {
        const sidebar = document.getElementById("sidebar");
        const toggle = document.querySelector(".menu-toggle");
        if (!sidebar.contains(event.target) && !toggle.contains(event.target)) closeMenu();
      }
    });
    
    function renderPortfolioRouteFromLocation() {
      const raw = String(window.location.hash || "").replace(/^#/, "");
      let category = "home", query = "";
      if (raw.startsWith("search=")) {
        category = "search";
        try { query = decodeURIComponent(raw.slice(7)); } catch (_) { query = raw.slice(7); }
      } else if (raw) {
        try { category = decodeURIComponent(raw); } catch (_) { category = "home"; }
      }
      const validCategory = category === "home" || category === "contact" || category === "about" || category === "art" || category === "search" || Array.isArray(categoryData[category]);
      if (!validCategory || (category === "search" && !query)) { category = "home"; query = ""; }
      const routeKey = portfolioRouteKey(category, query);
      if (routeKey === lastPortfolioRouteKey && currentCategory === category) return;
      lastPortfolioRouteKey = routeKey;
      if (category === "search") doSearch(query, false);
      else loadContent(category, document.querySelector(`.sidebar [data-navigation="${category}"]`) || document.getElementById("home-link"));
    }
    window.addEventListener("popstate", renderPortfolioRouteFromLocation);
    window.addEventListener("hashchange", renderPortfolioRouteFromLocation);
    renderPortfolioRouteFromLocation();
    updateBackToTop();
    
    function getYouTubeId(link) {
      try {
        const url = new URL(link, window.location.href);
        return url.searchParams.get("v") || url.pathname.split("/").filter(Boolean).pop() || "";
      } catch (_) { return ""; }
    }

    async function fetchYouTubeTitle(id) {
      const cacheKey = `sw-youtube-title-${id}`;
      try {
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.title && Date.now() - parsed.time < 7 * 86400000) return parsed.title;
        }
      } catch (_) {}
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);
      try {
        const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${id}`)}&format=json`, { signal: controller.signal });
        if (!response.ok) throw new Error("YouTube title unavailable");
        const data = await response.json();
        const title = typeof data.title === "string" ? data.title : "Title not available";
        try { sessionStorage.setItem(cacheKey, JSON.stringify({ title, time: Date.now() })); } catch (_) {}
        return title;
      } catch (_) { return null; }
      finally { clearTimeout(timeout); }
    }

    const youtubeTitleJobs = new Map();
    async function getYouTubeTitleOnce(id) {
      if (!youtubeTitleJobs.has(id)) {
        const job = fetchYouTubeTitle(id).finally(() => youtubeTitleJobs.delete(id));
        youtubeTitleJobs.set(id, job);
      }
      return youtubeTitleJobs.get(id);
    }

    async function populateYouTubeVideos(indexes = null) {
      const ids = youtubeVideoIds.slice().reverse();
      const wanted = indexes == null
        ? ids.map((_, index) => index)
        : [...new Set(indexes)].filter(index => Number.isInteger(index) && index >= 0 && index < ids.length);
      let cursor = 0;
      const worker = async () => {
        while (cursor < wanted.length) {
          const index = wanted[cursor++];
          const id = ids[index];
          if (!id) continue;
          const title = await getYouTubeTitleOnce(id);
          // Keep the useful local fallback when YouTube blocks oEmbed, the video
          // is private, or the visitor is offline. Do not replace it with an error label.
          if (typeof title !== "string" || !title.trim()) continue;
          const item = categoryData.youtube[index];
          if (item) item.desc = title;
          document.querySelectorAll(`[data-video-id="${id}"] .desc`).forEach(node => { node.textContent = title; });
        }
      };
      await Promise.all(Array.from({ length: Math.min(4, wanted.length) }, worker));
    }

    // Only fetch titles for the three YouTube cards visible on Home at startup.
    // Opening the full YouTube section enriches the complete catalogue on demand.
    function populateVisibleYouTubePreview() {
      const visibleItems = getHomeOrderedItems("youtube").slice(0, 3);
      const indexes = visibleItems.map(item => categoryData.youtube.indexOf(item)).filter(index => index >= 0);
      populateYouTubeVideos(indexes);
    }

    populateVisibleYouTubePreview();
  </script>
